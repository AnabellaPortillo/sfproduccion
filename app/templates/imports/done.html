{% extends "base.html" %}
{% block title %}Importación completada{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card text-center">
      <div class="card-body py-5">
        <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
        <h2 class="mt-3 fw-bold">¡Importación completada!</h2>

        <div class="row g-3 my-4">
          <div class="col-4">
            <div class="card kpi-card kpi-blue py-3">
              <div class="kpi-value">{{ orders }}</div>
              <div class="kpi-label">Protocolos importados</div>
            </div>
          </div>
          <div class="col-4">
            <div class="card kpi-card kpi-green py-3">
              <div class="kpi-value">{{ results }}</div>
              <div class="kpi-label">Resultados cargados</div>
            </div>
          </div>
          <div class="col-4">
            <div class="card kpi-card kpi-orange py-3">
              <div class="kpi-value">{{ skipped }}</div>
              <div class="kpi-label">Omitidos (duplicados)</div>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 justify-content-center">
          <a href="/orders" class="btn btn-primary"><i class="bi bi-clipboard2-pulse me-2"></i>Ver órdenes</a>
          <a href="/import" class="btn btn-outline-secondary"><i class="bi bi-upload me-2"></i>Importar otro</a>
          <a href="/patients" class="btn btn-outline-secondary"><i class="bi bi-people me-2"></i>Ver pacientes</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
