<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — LabCore LIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <style>
    body { background: #0f172a; min-height: 100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { width: 100%; max-width: 400px; border-radius: 1rem; border: 1px solid #1e293b; }
    .login-card .card-header { background: #1e293b; border-radius: 1rem 1rem 0 0; border-bottom: 1px solid #334155; }
    .brand-logo { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="card login-card shadow-lg bg-dark text-light">
    <div class="card-header py-4 text-center">
      <i class="bi bi-droplet-half fs-2 brand-logo"></i>
      <h4 class="mt-2 mb-0 fw-bold">LabCore LIS</h4>
      <p class="text-secondary small mb-0">Sistema de Información de Laboratorio</p>
    </div>
    <div class="card-body p-4">
      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/login">
        <div class="mb-3">
          <label class="form-label small text-secondary">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control bg-dark border-secondary text-light" placeholder="Usuario" required autofocus />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small text-secondary">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control bg-dark border-secondary text-light" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
        </button>
      </form>
    </div>
    <div class="card-footer text-center text-secondary small py-3" style="background:#1e293b;border-radius:0 0 1rem 1rem;border-top:1px solid #334155;">
      LabCore LIS v1.0 &mdash; Demo: <strong>admin / admin123</strong>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
