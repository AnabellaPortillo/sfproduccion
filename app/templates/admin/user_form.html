{% extends "base.html" %}
{% block title %}Nuevo Usuario{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-person-plus me-2 text-primary"></i>Nuevo Usuario</h1>
  <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/admin/users">Usuarios</a></li><li class="breadcrumb-item active">Nuevo</li></ol></nav>
</div>
<div class="row justify-content-center">
  <div class="col-md-6">
    <form method="post" action="/admin/users/new">
      <div class="card">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Usuario *</label>
              <input type="text" name="username" class="form-control form-control-sm" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Rol</label>
              <select name="role" class="form-select form-select-sm">
                {% for r in roles %}<option value="{{ r.value }}">{{ r.value }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">Nombre completo *</label>
              <input type="text" name="full_name" class="form-control form-control-sm" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email</label>
              <input type="email" name="email" class="form-control form-control-sm" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Contraseña *</label>
              <input type="password" name="password" class="form-control form-control-sm" required />
            </div>
          </div>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        <a href="/admin/users" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
