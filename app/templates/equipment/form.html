{% extends "base.html" %}
{% block title %}{{ 'Editar' if eq else 'Nuevo' }} Equipo{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-cpu me-2 text-primary"></i>{{ 'Editar' if eq else 'Nuevo' }} Equipo</h1>
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/equipment">Equipos</a></li>
      <li class="breadcrumb-item active">{{ 'Editar' if eq else 'Nuevo' }}</li>
    </ol>
  </nav>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <form method="post" action="{{ '/equipment/' + eq.id|string + '/edit' if eq else '/equipment/new' }}">
      <div class="card">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small fw-semibold">Nombre *</label>
              <input type="text" name="name" class="form-control form-control-sm" required value="{{ eq.name if eq else '' }}" />
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Estado</label>
              <select name="status" class="form-select form-select-sm">
                {% for s in ['ACTIVE','MAINTENANCE','INACTIVE'] %}
                <option value="{{ s }}" {% if eq and eq.status.value == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Fabricante</label>
              <input type="text" name="manufacturer" class="form-control form-control-sm" value="{{ eq.manufacturer or '' if eq else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Modelo</label>
              <input type="text" name="model" class="form-control form-control-sm" value="{{ eq.model or '' if eq else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">N° Serie</label>
              <input type="text" name="serial_number" class="form-control form-control-sm" value="{{ eq.serial_number or '' if eq else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Tipo</label>
              <input type="text" name="equipment_type" class="form-control form-control-sm" placeholder="Hematología, Bioquímica..." value="{{ eq.equipment_type or '' if eq else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Ubicación</label>
              <input type="text" name="location" class="form-control form-control-sm" value="{{ eq.location or '' if eq else '' }}" />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Ult. Calibración</label>
              <input type="date" name="last_calibration" class="form-control form-control-sm" value="{{ eq.last_calibration.strftime('%Y-%m-%d') if eq and eq.last_calibration else '' }}" />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Próx. Calibración</label>
              <input type="date" name="next_calibration" class="form-control form-control-sm" value="{{ eq.next_calibration.strftime('%Y-%m-%d') if eq and eq.next_calibration else '' }}" />
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">Notas</label>
              <textarea name="notes" class="form-control form-control-sm" rows="3">{{ eq.notes or '' if eq else '' }}</textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        <a href="/equipment" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
